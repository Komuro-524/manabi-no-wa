<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まなびのわ - ログイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F7F5F0; --surface:#FFFFFF;
    --ink:#1E1B16; --ink-soft:#6B6459; --ink-faint:#9C948A;
    --line:#E7E2D8; --line-soft:#F0EDE5;
    --teal:#3D6B5C; --teal-soft:#E4ECE8;
    --amber:#B8763E; --amber-soft:#F5E9DA;
    --slate:#4A6A8A; --slate-soft:#E4EAF0;
    --plum:#7A5C8C; --plum-soft:#EBE4EF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;margin:0;}
  ::placeholder{color:var(--ink-faint);}
</style>
</helmet>

<div style="position:relative;width:100%;max-width:1280px;min-height:820px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px;overflow:hidden;box-sizing:border-box;padding:48px 24px;">

  <!-- decorative tag motifs floating in the background -->
  <span style="position:absolute;top:8%;left:8%;width:56px;height:26px;clip-path:polygon(0 50%,14px 0,100% 0,100% 100%,14px 100%);background:var(--teal-soft);opacity:0.55;transform:rotate(-8deg);"></span>
  <span style="position:absolute;top:8%;left:8%;width:6px;height:6px;margin:10px 0 0 6px;border-radius:999px;border:1.6px solid var(--teal);opacity:0.55;transform:rotate(-8deg);"></span>
  <span style="position:absolute;bottom:14%;right:8%;width:64px;height:28px;clip-path:polygon(0 50%,15px 0,100% 0,100% 100%,15px 100%);background:var(--amber-soft);opacity:0.55;transform:rotate(10deg);"></span>
  <span style="position:absolute;bottom:14%;right:8%;width:6px;height:6px;margin:11px 0 0 7px;border-radius:999px;border:1.6px solid var(--amber);opacity:0.55;transform:rotate(10deg);"></span>
  <span style="position:absolute;top:24%;right:14%;width:14px;height:14px;border-radius:999px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--slate-soft);opacity:0.7;"></span>

  <!-- logo / title -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
    <div style="width:64px;height:64px;border-radius:18px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--bg),0 0 0 8px var(--teal-soft);">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="13" rx="3" stroke="var(--teal)" stroke-width="1.8"></rect><circle cx="9" cy="7" r="2.3" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.8"></circle><path d="M8 12.5h8M8 16h5" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </div>
    <h1 style="font-size:clamp(32px,8vw,52px);font-weight:800;letter-spacing:0.02em;">まなびのわ</h1>
    <div style="font-size:13.5px;color:var(--ink-faint);">もくもく会の会話から、知見と興味をつなぐ</div>
  </div>

  <!-- login form -->
  <div style="display:flex;flex-direction:column;gap:18px;width:min(360px,88vw);">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <label style="font-size:12px;font-weight:700;color:var(--ink-soft);">ID</label>
      <input type="text" placeholder="社員IDを入力" style="padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;outline:none;">
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <label style="font-size:12px;font-weight:700;color:var(--ink-soft);">PASS</label>
      <input type="password" placeholder="パスワードを入力" style="padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;outline:none;">
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:6px;">
      <a href="./group.dc.html" style="display:inline-block;padding:13px 40px;border-radius:10px;border:none;background:var(--teal);color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--teal-soft);">LOGIN</a>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
